events {}

http {
  upstream nextjs { server nextjs:3000; }
  upstream backend { server backend:3000; }

  server {
    listen 80;

    # Site web Next.js (tout sauf /graphql).
    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API GraphQL : HTTP (queries/mutations) + upgrade WebSocket
    # (subscriptions du mobile). Les 4 headers Upgrade/Connection +
    # http_version 1.1 sont obligatoires pour que Nginx proxie le WS.
    location /graphql {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;   # garder le WS ouvert longtemps
    }
  }
}
