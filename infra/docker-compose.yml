# docker-compose pour le dev local FamilyPay
# Voir PROJECT_CONTEXT.md §9 et infra/AGENTS.md pour les règles de portabilité.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familypay}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # PG18+ stocke les données dans un sous-dossier version-spécifique sous
    # /var/lib/postgresql (pas /var/lib/postgresql/data comme en PG16/17).
    # Monter à la racine permet à pg_upgrade de fonctionner sans frontière de mount.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-familypay}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Services applicatifs ---
  # backend : NestJS (GraphQL + TypeORM + PostgreSQL).
  # nextjs : front Next.js (espace parent + page publique de don).
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  nextjs:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # NEXT_PUBLIC_* est lue au build Next.js et baked dans le bundle client.
      # Elle doit pointer vers une URL accessible depuis le navigateur (pas
      # depuis le réseau Docker) → http://localhost:3000/graphql en dev local.
      NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:3000/graphql}
    ports:
      - "${WEB_PORT:-3001}:3000"

  # Optionnel : pub/sub pour les subscriptions GraphQL (décommenter si besoin)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

volumes:
  pgdata:
