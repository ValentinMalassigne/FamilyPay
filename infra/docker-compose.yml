# docker-compose pour le dev local FamilyPay
# Voir PROJECT_CONTEXT.md §9 et infra/AGENTS.md pour les règles de portabilité.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familypay}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-familypay}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Services applicatifs ---
  # backend : ré-activé (le Dockerfile est posé sur la branche backend).
  # nextjs : reste commenté jusqu'à la branche web (Dockerfile Next.js pas encore créé).
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  # nextjs:
  #   build:
  #     context: ../web
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #   environment:
  #     NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:3000/graphql}
  #   ports:
  #     - "3001:3000"

  # Optionnel : pub/sub pour les subscriptions GraphQL (décommenter si besoin)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

volumes:
  pgdata:
